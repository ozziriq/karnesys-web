<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title-tower desc-tower">
  <title id="title-tower">D&amp;D Tärningstorn i Hyper PLA Stardust</title>
  <desc id="desc-tower">Stiliserad teknisk illustration av ett 3D-utskrivet tärningstorn i mörkblå nyans med glittereffekt och en tärning.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tower-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Subtle glow -->
  <circle cx="400" cy="240" r="170" fill="#38bdf8" opacity="0.06"/>

  <!-- Stardust sparkles -->
  <g fill="#38bdf8" opacity="0.75">
    <circle cx="195" cy="145" r="2"/>
    <circle cx="240" cy="210" r="1.5"/>
    <circle cx="565" cy="135" r="2.2"/>
    <circle cx="610" cy="230" r="1.5"/>
    <circle cx="525" cy="310" r="2"/>
    <circle cx="255" cy="340" r="1.8"/>
    <circle cx="485" cy="165" r="1.5"/>
    <circle cx="315" cy="120" r="2"/>
  </g>
  <g fill="#f8fafc" opacity="0.6">
    <circle cx="220" cy="280" r="1.3"/>
    <circle cx="590" cy="180" r="1.2"/>
    <circle cx="460" cy="95" r="1.5"/>
    <circle cx="340" cy="370" r="1.2"/>
  </g>

  <!-- Dice Tower Structure -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linejoin="round">
    <!-- Base tray -->
    <polygon points="270,390 530,390 555,420 245,420" fill="#1e293b"/>
    <rect x="270" y="340" width="260" height="50" rx="4" fill="#0f172a"/>
    <!-- Tower body -->
    <rect x="330" y="125" width="140" height="215" fill="url(#tower-grad)"/>
    <!-- Battlements -->
    <polygon points="320,125 320,95 348,95 348,112 372,112 372,95 428,95 428,112 452,112 452,95 480,95 480,125" fill="#334155"/>
    <!-- Internal baffle hints (dashed) -->
    <line x1="340" y1="175" x2="430" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6"/>
    <line x1="460" y1="230" x2="370" y2="265" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6"/>
    <!-- Arch exit -->
    <path d="M 365 340 L 365 292 A 35 35 0 0 1 435 292 L 435 340 Z" fill="#0f172a"/>
  </g>

  <!-- Horizontal FDM layer lines texture -->
  <g stroke="#94a3b8" stroke-width="0.7" opacity="0.22">
    <line x1="334" y1="145" x2="466" y2="145"/>
    <line x1="334" y1="160" x2="466" y2="160"/>
    <line x1="334" y1="175" x2="466" y2="175"/>
    <line x1="334" y1="190" x2="466" y2="190"/>
    <line x1="334" y1="205" x2="466" y2="205"/>
    <line x1="334" y1="220" x2="466" y2="220"/>
    <line x1="334" y1="235" x2="466" y2="235"/>
    <line x1="334" y1="250" x2="466" y2="250"/>
  </g>

  <!-- D20 Icon in tray -->
  <g transform="translate(400, 368)" stroke="#38bdf8" stroke-width="1.8" fill="#1e293b">
    <polygon points="0,-24 22,-11 22,13 0,25 -22,13 -22,-11"/>
    <polyline points="-22,-11 0,-4 22,-11" fill="none" opacity="0.8"/>
    <polyline points="0,-24 0,-4 0,25" fill="none" opacity="0.65"/>
    <polyline points="-22,13 0,-4 22,13" fill="none" opacity="0.65"/>
    <text x="0" y="5" text-anchor="middle" fill="#f8fafc" stroke="none" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">20</text>
  </g>

  <!-- Label badge -->
  <rect x="28" y="28" width="236" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="146" y="49" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">HYPER PLA STARDUST • 0.4 MM</text>
</svg>
